[project]
name = "hrbotnew"
version = "0.1.0"
description = "Highrise Game Bot with keepalive web server for Render deployment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "highrise-bot-sdk>=23.1.0b13",
    "python-dotenv>=1.0.0",
    "setuptools<70",
    "yt-dlp>=2026.10.21",
]

[tool.uv]
package = false


[project.scripts]
hrbotnew = "hrbotnew:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
