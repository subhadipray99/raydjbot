services:
  - type: web
    name: highrise-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ROOM_ID
        sync: false
      - key: API_TOKEN
        sync: false
      - key: BOT_PREFIX
        value: "!"
