services:
  - type: web
    name: raydjbot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ROOM_ID
        value: "64005ecfb3d3644258e0040e"
      - key: API_TOKEN
        sync: false
      - key: ROOM_OWNER
        value: "shuvodip"
      - key: ROOM_TITLE
        value: "YouTube"
      - key: BOT_PREFIX
        value: "!"
      - key: AUTOPLAY_ENABLED
        value: "true"
